name: Test and analyze packet handler library

on:
  push:
    branches:
      - pm5
  pull_request:
    branches:
      - pm5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PHP library
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP environment
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.2"
          install-path: ./.php-bin
          pm-version-major: "5"

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install locked Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --no-plugins

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Run packet handler regression tests
        run: composer test

      - name: Run PHPStan at maximum level
        run: composer analyse
